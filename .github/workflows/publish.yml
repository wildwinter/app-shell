name: Publish

# Publishes @wildwinter/app-shell to the public npm registry (npmjs.org) when a
# GitHub Release is published. Cut releases with `npm run release -- patch`
# (etc.) - that script bumps package.json, commits, pushes, tags, and creates
# the Release in one step, so the released tag always points at a fresh,
# not-yet-published version. (Publishing a version already on the registry is a
# no-op: the step below skips it.)
#
# Publishing authenticates via npm TRUSTED PUBLISHING (OIDC): each package
# trusts this repo + this workflow file on npmjs.com, so no npm token is
# stored anywhere, and provenance attestations are generated automatically.
# Requirements: `id-token: write` below, and an OIDC-aware npm CLI (>= 11.5.1)
# on the runner. The packages publish publicly via publishConfig.access: public.
#
# `workflow_dispatch` reruns the publish for the versions currently on main,
# for the case where a release's own run failed: every step skips a version
# that is already on the registry, so a rerun publishes only what is missing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Needs >= 11.5.1 for OIDC trusted publishing. Pinned to the 11.x line on purpose:
      # npm 12.0.0 ships a broken provenance path ("Cannot find module 'sigstore'"),
      # which aborts every publish once `@latest` rolls over to it - npm/cli#9722.
      - name: OIDC-aware npm (>= 11.5.1; pin off the broken npm 12.x)
        run: npm install -g npm@11
      # No token anywhere: npm's OIDC detection handles auth by itself.
      - run: echo "# auth via npm trusted publishing (OIDC) - no token" > ~/.npmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish @wildwinter/app-shell
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@wildwinter/app-shell@$VER" version >/dev/null 2>&1; then
            echo "@wildwinter/app-shell@$VER already published; skipping."
          else
            npm publish
          fi
